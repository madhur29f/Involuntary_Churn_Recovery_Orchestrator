services:
  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://recovery:recovery@postgres:5432/recovery
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis, temporal]
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: recovery, POSTGRES_PASSWORD: recovery, POSTGRES_DB: recovery }
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./db/migrations:/docker-entrypoint-initdb.d:ro"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  temporal:
    image: temporalio/auto-setup:1.25.2
    environment: { DB: postgresql, POSTGRES_SEEDS: postgres, POSTGRES_USER: recovery, POSTGRES_PWD: recovery }
    depends_on: [postgres]
    ports: ["7233:7233"]
volumes: { postgres_data: {} }
